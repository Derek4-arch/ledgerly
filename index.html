<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ledgerly · Bills, subscriptions &amp; renewals</title>
  <meta name="description" content="Ledgerly keeps every subscription, bill, free trial and renewal in one calm place, with reminders and savings tips. Private: your data stays on your device.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F7F8F7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ledgerly">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <script>
    /* Apply the saved theme before first paint to avoid a flash */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('ledgerly:v1') || '{}');
        var t = (s.settings && s.settings.theme) || 'system';
        if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div id="route-bar" class="route-bar" aria-hidden="true"></div>

  <div class="app">
    <aside class="sidebar" aria-label="Main">
      <a class="brand" href="#/" aria-label="Ledgerly home"><span data-logo="30"></span><span class="brand__name">Ledgerly</span></a>
      <button type="button" class="search-trigger" data-action="open-palette" aria-label="Search or run a command (Ctrl+K)">
        <span data-icon="search" data-size="18"></span><span>Search or jump to…</span><kbd>Ctrl K</kbd>
      </button>
      <nav id="side-nav" class="side-nav" aria-label="Sections"></nav>
      <div class="sidebar__add">
        <button type="button" class="btn btn--primary btn--block" data-action="add-item"><span data-icon="plus" data-size="18"></span><span>Add subscription</span></button>
        <button type="button" class="btn btn--ghost btn--block" data-action="add-doc"><span data-icon="shield" data-size="18"></span><span>Add renewal</span></button>
      </div>
      <div class="sidebar__foot">
        <p class="privacy-badge"><span data-icon="lock" data-size="16"></span><span>Private by design. Your data stays on this device.</span></p>
        <button type="button" class="link-btn small" data-action="shortcuts"><span data-icon="keyboard" data-size="16"></span>Shortcuts <kbd>?</kbd></button>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <a class="brand brand--top" href="#/" aria-label="Ledgerly home"><span data-logo="28"></span></a>
        <a class="topbar__title" href="#/" id="topbar-title" tabindex="-1" aria-hidden="true">Ledgerly</a>
        <div class="topbar__actions">
          <button type="button" class="icon-btn topbar__search" data-action="open-palette" aria-label="Search or run a command" title="Search (Ctrl K)"><span data-icon="search"></span></button>
          <button type="button" class="icon-btn" data-action="toggle-theme" data-theme-icon aria-label="Toggle dark mode"></button>
          <button type="button" class="icon-btn icon-btn--badge" data-action="open-notifs" aria-label="Reminders" title="Reminders (B)"><span data-icon="bell"></span><span class="badge" data-badge hidden>0</span></button>
          <a class="icon-btn topbar__settings" href="#/settings" aria-label="Settings" data-nav="settings"><span data-icon="settings"></span></a>
        </div>
      </header>
      <main id="view" class="main" tabindex="-1"></main>
    </div>

    <nav id="tab-nav" class="tabbar" aria-label="Sections"></nav>
    <button type="button" class="fab" data-action="fab" aria-label="Add"><span data-icon="plus" data-size="26"></span></button>
  </div>

  <div id="overlay-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript><div class="noscript">Ledgerly needs JavaScript to run. Everything stays on your device.</div></noscript>

  <!-- core logic (pure, unit tested) -->
  <script src="js/dates.js"></script>
  <script src="js/library.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/ics.js"></script>
  <!-- browser layer -->
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/ui.js"></script>
  <!-- views -->
  <script src="js/views/common.js"></script>
  <script src="js/views/sheets.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/subscriptions.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/documents.js"></script>
  <script src="js/views/insights.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/onboarding.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
